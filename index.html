<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <title>OMEGA</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="crt" class="crt" aria-hidden="true">
        <div class="crt-glass"></div>
        <div class="crt-grid"></div>
        <div class="crt-scan"></div>
        <div class="crt-roll"></div>
        <div class="crt-vignette"></div>
        <div class="crt-corners">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div id="score-veil" class="score-veil"></div>
      <div class="hud-bl">
        <div class="label" data-label="score"></div>
        <div id="score"></div>
        <div class="label ore-label" data-label="ore"></div>
        <div id="ore"></div>
        <div class="label" data-label="pts"></div>
        <div id="points"></div>
        <div id="hub-ore"></div>
      </div>
      <div id="version" class="version"></div>
      <div class="hud-br">
        <div class="label" data-label="ships"></div>
        <div id="lives"></div>
        <div class="label shield-label" data-label="shield"></div>
        <div id="shield"><div id="shield-fill"></div></div>
        <div class="label special-label" data-label="special"></div>
        <div id="special"></div>
      </div>
      <div id="center" class="hud-center">
        <div class="attract-rule"></div>
        <h1></h1>
        <div class="attract-rule thin"></div>
        <p class="tag"></p>
        <div id="wave-pick" class="wave-pick is-hidden">
          <div id="wave-row" class="wave-row"></div>
        </div>
        <div id="score-board" class="score-board is-hidden"></div>
        <p class="help"></p>
        <p class="help"></p>
        <p class="help subtle"></p>
        <p id="cta" class="cta"></p>
        <p id="ships-link" class="ships-link"></p>
        <p id="controls-link" class="ships-link"></p>
        <p id="credit" class="credit"></p>
      </div>
      <div id="ships-page" class="ships-page is-hidden">
        <div id="ships-heading"></div>
        <div id="ships-hint" class="ships-hint"></div>
      </div>
      <div id="controls-page" class="controls-page is-hidden">
        <div id="controls-heading"></div>
        <div id="controls-profiles" class="controls-profiles"></div>
        <div id="controls-list" class="controls-list"></div>
        <div id="controls-hint"></div>
      </div>
      <div id="alert" class="hub-alert" hidden>
        <div class="alert-title"></div>
        <div id="alert-sub" class="alert-sub"></div>
      </div>
      <button id="continue-btn" class="continue-btn is-hidden" type="button"></button>
      <div id="mode" class="mode-banner" hidden></div>
      <div id="pad-status" class="pad-status" hidden>Gamepad connected</div>
      <div id="device-pick" class="device-pick is-hidden">
        <div class="device-panel">
          <div id="device-title"></div>
          <div class="device-row">
            <button id="pick-desktop" class="device-btn" type="button"></button>
            <button id="pick-phone" class="device-btn" type="button"></button>
          </div>
        </div>
      </div>
      <div id="touch-layer" class="touch-layer is-hidden">
        <div class="stick stick-left" id="stick-move">
          <div class="stick-well"></div>
          <div class="stick-knob"></div>
        </div>
        <div class="stick stick-right" id="stick-turn">
          <div class="stick-well"></div>
          <div class="stick-knob"></div>
        </div>
        <div id="touch-sight" class="touch-sight is-hidden"></div>
      </div>
      <div id="dock-bay" class="dock-bay is-hidden">
        <div class="dock-panel">
          <div id="dock-title"></div>
          <div id="dock-ships" class="dock-ships"></div>
          <div id="dock-ups" class="dock-ups"></div>
          <div id="dock-hint"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
